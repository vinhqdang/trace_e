[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace_e"
version = "0.1.0"
description = "Evaluation pipeline for graph source detection and misinformation blocking"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "networkx", "pandas", "scikit-learn", "matplotlib", "pyyaml"]

[tool.setuptools.packages.find]
include = ["trace_e*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
